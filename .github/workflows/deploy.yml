
name: Docker CI/CD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t monolithic-app .

      - name: Check Docker Image
        run: docker images

      - name: Run Docker Container
        run: docker run -d --name monolithic-test -p 5000:5000 monolithic-app

      - name: Wait for Application
        run: |
          for i in {1..15}; do
            if curl --silent --fail http://localhost:5000/; then
              echo "Application is responding"
              exit 0
            fi
            echo "Waiting for application..."
            sleep 2
          done
          echo "Application failed to respond"
          docker ps -a
          docker logs monolithic-test
          exit 1

      - name: Stop Docker Container
        if: always()
        run: docker stop monolithic-test || true
