
name: Docker CI/CD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t monolithic-app .

      - name: Check Docker Image
        run: docker images

      - name: Run Docker Container
        run: docker run -d --name monolithic-test -p 5000:5000 monolithic-app

      - name: Test Application
        run: curl --retry 10 --retry-connrefused --retry-delay 2 --fail http://localhost:5000

      - name: Stop Docker Container
        if: always()
        run: docker stop monolithic-test || true
